# Metadata hien thi cua EZG Addon Hub.
#
# File nay KHONG thay the blender_manifest.toml.
#   - blender_manifest.toml -> Blender doc (qua index.json) de CAI va UPDATE
#   - catalog.toml          -> hub doc de HIEN THI (nhom, mo ta tieng Viet, anh)
#
# Dung TOML (khong phai YAML/JSON) vi doc duoc bang `tomllib` co san trong Python 3.11
# cua Blender -> khong can cai them gi. Xem tools/gen_catalog.py.
#
# `id` phai trung voi `id` trong blender_manifest.toml. Sai id se lam build that bai.

schema = 1

# ---------------------------------------------------------------------------
# Nhom hien thi trong hub
# ---------------------------------------------------------------------------
[[groups]]
id = "hub"
label = "Hub"
items = ["ezg_addon_hub"]

[[groups]]
id = "pipeline"
label = "Pipeline"
items = ["ezg_fbx_batch"]

[[groups]]
id = "modeling"
label = "Modeling / UV"
items = ["ezg_deco_namer", "ezg_auto_uv_palette"]

[[groups]]
id = "nodes"
label = "Geometry Nodes"
items = ["ezg_gn_info_namer"]

[[groups]]
id = "rigging"
label = "Rigging / Animation"
items = ["ezg_mixamo_marker_rigger", "ezg_mixamo_anim_lib", "ezg_anim_tools"]

# ---------------------------------------------------------------------------
# Addon cua EZG
# ---------------------------------------------------------------------------
[items.ezg_addon_hub]
title_vi = "EZG Addon Hub"
summary_vi = """
Trung tam quan li addon: cai addon EZG, kiem ke moi addon dang co tren may,
va backup / phuc hoi profile addon khi doi may hoac cai lai Blender.
Hub tu cap nhat chinh no qua kho nay."""
thumbnail = "thumbs/ezg_addon_hub.png"
recommended = true

[items.ezg_deco_namer]
title_vi = "Deco Namer"
summary_vi = """
Doi ten hang loat mesh theo tien to deco_NN_ kem hau to chu cai.
Tu dong nhay qua cac hau to da bi chiem.
Hover vao rule de sang len nhom mesh cung ten."""
thumbnail = "thumbs/ezg_deco_namer.png"
recommended = true

[items.ezg_fbx_batch]
title_vi = "FBX Batch to Blend Converter"
summary_vi = """
Convert hang loat FBX trong 1 folder sang .blend, giu texture (pack vao file).
Hai che do: moi FBX ra 1 file rieng, hoac gom tat ca vao 1 file.
Chay bang tien trinh Blender nen rieng nen khong dong bang UI."""
thumbnail = "thumbs/ezg_fbx_batch.png"
recommended = true

[items.ezg_gn_info_namer]
title_vi = "GN Info Namer"
summary_vi = """
Chon object ngoai viewport, bam mot nut la moi cai thanh mot node Object Info,
noi het vao mot Join Geometry, dat nhan va dan thang hang luon.
Dat nhan cho node Object Info / Collection Info theo ten object ma node do dang
tro toi, nen nhin cay Geometry Nodes la doc duoc ngay thay vi phai bam vao tung
node. Chay cho cay dang mo (ke ca group long ben trong) hoac ca file.
Kem nut dan cac node do ve mot cot thang, cach deu va thu nho lai cho gon —
sap theo vi tri dang thay hoac theo nhan A→Z.
Va nut don: xoa cac node Info khong tro toi object nao hoac khong noi vao dau,
co bang xem truoc liet ke dung nhung node sap bi xoa kem ly do."""
thumbnail = "thumbs/ezg_gn_info_namer.png"
recommended = false

[items.ezg_auto_uv_palette]
title_vi = "Auto UV Palette"
summary_vi = """
Scale va sap xep UV cua cac object dang chon vao mot luoi palette.
Dung khi nhieu object dung chung mot texture bang mau."""
thumbnail = "thumbs/ezg_auto_uv_palette.png"
recommended = false

[items.ezg_mixamo_marker_rigger]
title_vi = "Manual Marker Mixamo Rigger"
summary_vi = """
Dat marker khop (cam, hang, co tay, khuyu, dau goi) len nhan vat T-Pose,
tu sinh armature chuan Mixamo roi bind weight tu dong.
Marker ben phai tu bam theo ben trai qua driver, chon duoc truc doi xung."""
thumbnail = "thumbs/ezg_mixamo_marker_rigger.png"
recommended = false

[items.ezg_mixamo_anim_lib]
title_vi = "Mixamo Animation Library"
summary_vi = """
Duyet mot thu muc chua file FBX tai tu Mixamo va ap animation thang vao rig.
Khoi phai import tung file mot roi retarget bang tay."""
thumbnail = "thumbs/ezg_mixamo_anim_lib.png"
recommended = true

[items.ezg_anim_tools]
title_vi = "EZG Animation Tools"
summary_vi = """
Hai viec quanh chuyen dong: RETARGET animation tu mot bo xuong bat ki sang bo
xuong khac (tu doan bang anh xa tu ten xuong, tu bu chenh lech rest pose A-pose
vs T-pose, quy doi tinh tien hong theo ti le chieu cao), va LAT GUONG trai/phai
mot action (sao du ca kenh cap object nen khong bi sai scale khi export).
Ca hai deu co nut do sai lech de biet ket qua bam sat den dau."""
thumbnail = "thumbs/ezg_anim_tools.png"
recommended = false

# ---------------------------------------------------------------------------
# Addon BEN THU BA — chi tro toi nguon, KHONG dua vao repo EZG.
#
# Hub hien thi de user biet ma cai, nhung viec update do chinh nguon lo.
# Dua chung vao repo EZG se khien ban trong hub mai mai tre hon ban goc.
# Xem docs/ARCHITECTURE.md muc 4 (nhom A / C).
# ---------------------------------------------------------------------------
